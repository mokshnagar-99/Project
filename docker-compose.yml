version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: groq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  orchestrator:
    build: .
    container_name: groq_orchestrator
    restart: unless-stopped
    command: python orchestrator.py
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    ports:
      - "9090:9090"
    volumes:
      - ./generated:/app/generated

  api:
    build: .
    container_name: groq_api
    restart: unless-stopped
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./generated:/app/generated

  streamlit:
    build: .
    container_name: groq_streamlit
    restart: unless-stopped
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    ports:
      - "8501:8501"
    volumes:
      - ./generated:/app/generated

  prometheus:
    image: prom/prometheus:latest
    container_name: groq_prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - orchestrator

  grafana:
    image: grafana/grafana:latest
    container_name: groq_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  redis_data:
